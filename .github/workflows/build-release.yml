name: Build & Release EngineSound APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact
        id: prepare_artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/EngineSound-Haptics-v1.0.0.apk
          echo "APK successfully generated and copied."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngineSound-Haptics-APK
          path: release-output/EngineSound-Haptics-v1.0.0.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v1.0.0-$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release and Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "EngineSound Haptics ${{ env.TAG_NAME }} (Redmi K40G 专版)"
          body: |
            ### 触觉低音炮 (EngineSound) 发布说明

            专为 **红米 K40 游戏增强版 (Redmi K40G / 天玑1200 / X轴线性马达 / 已ROOT)** 深度定制的触觉引擎应用。

            #### ✨ 核心功能
            - **两种音频来源**：支持打开本地音频文件，或开启【全局音频捕获】免打开文件监听 B站、网易云、抖音、游戏等所有第三方 App 发声。
            - **两种工作模式**：
              - **模式 A (默认)**：喇叭正常放歌 + 马达跟随低频鼓点瞬态打击。
              - **模式 B (纯振动模拟)**：**喇叭静音不出声！** 将 0~200Hz 低频包络连续映射为马达不同强度物理共振，用手机机身模拟低音炮振膜。
            - **双驱动引擎**：支持 Android 原生 `Vibrator` 与 `ROOT Sysfs` 硬件底层直接读写（<1ms 极低延迟）。
            - **安全与平滑防护**：包含非对称包络平滑滤波（防止马达爆震频闪）与连续高占空比线圈过热保护。
            - **延迟校准**：内置时间偏移滑块（-150ms ~ +250ms）精准对齐音振同步。

            #### ⚠️ 刷入与使用说明
            1. 下载下方 APK 并安装。
            2. 授予 ROOT 权限（Magisk / KernelSU）以启用 Sysfs 极速直驱。
            3. 若使用全局音频捕获，请在弹出的系统屏幕/音频捕获授权中点击「立即开始」。
            4. 在 MIUI / HyperOS 电池设置中将本应用电池策略改为「无限制」，并开启「自启动」。
          files: release-output/EngineSound-Haptics-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
