name: Build & Release EngineSound APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact
        id: prepare_artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/EngineSound-Haptics-v1.1.0.apk
          echo "APK successfully generated and copied."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngineSound-Haptics-APK
          path: release-output/EngineSound-Haptics-v1.1.0.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v1.1.0-$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release and Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "EngineSound Haptics ${{ env.TAG_NAME }} (全品牌通用 + K40G 专版)"
          body: |
            ### 触觉低音炮 (EngineSound) 发布说明

            全面兼容适配 **全品牌 Android 手机 (小米/红米/三星/一加/OPPO/vivo/Pixel等)**，并保留 **红米 K40 游戏增强版 (Redmi K40G / 天玑1200 / X轴线性马达 / 已ROOT)** 深度专属特调。

            #### 🚀 v1.1.0 更新日志
            - **全机型通用适配**：修复 Android 14+ 前台服务 `mediaProjection` 权限细分导致的启动闪退问题。
            - **免 ROOT 安全降级**：内置智能设备画像与只读环境探测，未 ROOT 手机自动选用原生 Vibrator 引擎，杜绝 `su` 执行错误。
            - **转子马达与富触觉基元支持**：支持线性马达 1~255 无级调幅，普通转子马达引入软件占空比算法，支持机型启用 `PRIMITIVE_THUD` 鼓点基元。
            - **通用模式 B 静音策略**：K40G 保持底层 `tinymix` 功放静音，普通手机自适应走系统流级静音。
            - **界面版本展示**：界面动态呈现识别到的机型画像与当前运行版本号。
          files: release-output/EngineSound-Haptics-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
